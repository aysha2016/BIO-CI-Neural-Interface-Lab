<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BIO-CI Neural Interface Lab</title>
    <!-- Single Page App Redirect for GitHub Pages -->
    <script>
      // Automatically redirect 404s back to the base path preserving path and query
      (function() {
        const repoBase = '/BIO-CI-Neural-Interface-Lab/';
        const path = window.location.pathname;
        if (!path.startsWith(repoBase)) {
          window.location.replace(repoBase);
        } else {
          // If within repo path but deep linked
          const relativePath = path.substring(repoBase.length);
          window.location.replace(repoBase + (relativePath ? '#' + relativePath : '') + window.location.search);
        }
      })();
    </script>
  </head>
  <body style="margin: 0; background-color: #030712; color: #94a3b8; font-family: system-ui, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh;">
    <div style="text-align: center; padding: 20px;">
      <h2 style="color: #f8fafc; font-size: 1.25rem; margin-bottom: 0.5rem;">BIO-CI Neural Interface Lab</h2>
      <p style="font-size: 0.875rem; margin-bottom: 1rem;">Redirecting to dashboard...</p>
      <a href="/BIO-CI-Neural-Interface-Lab/" style="color: #06b6d4; text-decoration: underline; font-size: 0.875rem;">Click here if not redirected automatically</a>
    </div>
  </body>
</html>
