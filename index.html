<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BIO-CI Neural Interface Lab</title>
    <meta name="description" content="Biologically Realistic Cochlear Implant–Auditory Nerve Simulation and Neural Engineering Dashboard" />
    <meta property="og:title" content="BIO-CI Neural Interface Lab" />
    <meta property="og:description" content="Biologically Realistic Cochlear Implant–Auditory Nerve Simulation and Neural Engineering Dashboard" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Prevent stale caching on GitHub Pages Fastly CDN -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- GitHub Pages Single Page App redirect handler -->
    <script>
      (function() {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect != location.href) {
          history.replaceState(null, null, redirect);
        }
      })();
    </script>
    <!-- Dynamic Production Asset Bridge: ensures site loads even if GitHub Pages serves raw main branch -->
    <script>
      (function() {
        var isGitHubPages = window.location.hostname.indexOf('github.io') !== -1;
        var isFileProto = window.location.protocol === 'file:';
        if (isGitHubPages || isFileProto) {
          // If the page is served statically without Vite bundling (raw repository root),
          // load the compiled production bundle directly from assets or jsDelivr CDN
          window.__isStaticHost = true;
          var base = '/BIO-CI-Neural-Interface-Lab/';
          
          var css = document.createElement('link');
          css.rel = 'stylesheet';
          css.crossOrigin = 'anonymous';
          css.href = base + 'assets/index.css';
          css.onerror = function() {
            var cdnCss = document.createElement('link');
            cdnCss.rel = 'stylesheet';
            cdnCss.crossOrigin = 'anonymous';
            cdnCss.href = 'https://cdn.jsdelivr.net/gh/aysha2016/BIO-CI-Neural-Interface-Lab@gh-pages/assets/index.css';
            document.head.appendChild(cdnCss);
          };
          document.head.appendChild(css);

          var js = document.createElement('script');
          js.type = 'module';
          js.crossOrigin = 'anonymous';
          js.src = base + 'assets/index.js';
          js.onerror = function() {
            var cdnJs = document.createElement('script');
            cdnJs.type = 'module';
            cdnJs.crossOrigin = 'anonymous';
            cdnJs.src = 'https://cdn.jsdelivr.net/gh/aysha2016/BIO-CI-Neural-Interface-Lab@gh-pages/assets/index.js';
            cdnJs.onerror = function() {
              if (window.bioShowError) {
                window.bioShowError('Asset Loading Error', 'Failed to load compiled scripts from assets/ or CDN. In GitHub repository Settings > Pages, verify Source is set to "GitHub Actions" or "gh-pages".');
              }
            };
            document.head.appendChild(cdnJs);
          };
          document.head.appendChild(js);
        }
      })();
    </script>
  </head>
  <body class="bg-[#070b14] text-slate-100 antialiased selection:bg-cyan-500/30 selection:text-cyan-200">
    <div id="root">
      <!-- High-Performance Preloader Shell with Active Progress Bar -->
      <div id="bio-loader-shell" style="min-height: 100vh; background-color: #070b14; display: flex; align-items: center; justify-content: center; font-family: 'Inter', system-ui, -apple-system, sans-serif; color: #94a3b8; padding: 20px;">
        <div style="text-align: center; max-width: 460px; width: 100%; padding: 28px; background: rgba(11, 19, 36, 0.85); border: 1px solid #1e293b; border-radius: 20px; box-shadow: 0 25px 35px -5px rgba(0, 0, 0, 0.7); backdrop-filter: blur(12px);">
          
          <!-- Animated Pulse Icon -->
          <div style="position: relative; width: 52px; height: 52px; margin: 0 auto 18px;">
            <div style="position: absolute; inset: 0; border: 3px solid rgba(6, 182, 212, 0.15); border-radius: 50%;"></div>
            <div style="position: absolute; inset: 0; border: 3px solid transparent; border-top-color: #06b6d4; border-right-color: #06b6d4; border-radius: 50%; animation: bio-spin 0.75s linear infinite;"></div>
            <div style="position: absolute; inset: 9px; background: rgba(6, 182, 212, 0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
              <div style="width: 10px; height: 10px; background: #06b6d4; border-radius: 50%; box-shadow: 0 0 12px #06b6d4;"></div>
            </div>
          </div>

          <h1 style="color: #f8fafc; font-size: 18px; font-weight: 700; margin: 0 0 4px 0; letter-spacing: -0.01em;">
            BIO-CI Neural Interface Lab
          </h1>
          <p id="bio-loader-status" style="font-size: 13px; line-height: 1.5; margin: 0 0 16px 0; color: #67e8f9; font-family: 'JetBrains Mono', monospace;">
            Initializing neural simulation workspace...
          </p>

          <!-- Active Loading Bar -->
          <div style="width: 100%; height: 5px; background: #131d31; border-radius: 9999px; overflow: hidden; position: relative; margin-bottom: 12px; border: 1px solid #1e293b;">
            <div id="bio-loader-bar" style="height: 100%; width: 15%; background: linear-gradient(90deg, #06b6d4, #38bdf8); border-radius: 9999px; transition: width 0.3s ease; box-shadow: 0 0 10px rgba(6, 182, 212, 0.5);"></div>
          </div>

          <div style="display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: #64748b; font-family: 'JetBrains Mono', monospace;">
            <span id="bio-loader-step">Step 1/3: Modules loaded</span>
            <span id="bio-loader-pct">15%</span>
          </div>

          <!-- Stalled network fallback alert (hidden initially) -->
          <div id="bio-loader-fallback" style="display: none; margin-top: 18px; padding-top: 14px; border-top: 1px solid #1e293b; text-align: center;">
            <p style="font-size: 12px; color: #94a3b8; margin: 0 0 10px 0;">
              Taking longer than expected?
            </p>
            <div style="display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;">
              <button onclick="window.bioAppMounted && window.bioAppMounted()" style="background: #0891b2; color: white; border: none; padding: 7px 14px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; transition: background 0.2s;">
                Reveal Dashboard
              </button>
              <button onclick="window.location.reload(true)" style="background: #1e293b; color: #e2e8f0; border: 1px solid #334155; padding: 7px 14px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; transition: background 0.2s;">
                Reload Page
              </button>
            </div>
          </div>

        </div>
      </div>
      <style>
        @keyframes bio-spin { to { transform: rotate(360deg); } }
      </style>
      <script>
        (function() {
          var bar = document.getElementById('bio-loader-bar');
          var pct = document.getElementById('bio-loader-pct');
          var status = document.getElementById('bio-loader-status');
          var step = document.getElementById('bio-loader-step');
          var fallback = document.getElementById('bio-loader-fallback');
          var shell = document.getElementById('bio-loader-shell');
          var progress = 15;
          var isMounted = false;

          // Expose explicit completion handler for React to trigger on mount
          window.bioAppMounted = function() {
            if (isMounted) return;
            isMounted = true;
            clearInterval(timer);
            if (bar) {
              bar.style.width = '100%';
              bar.style.background = 'linear-gradient(90deg, #10b981, #06b6d4)';
            }
            if (pct) pct.innerText = '100%';
            if (status) status.innerText = 'BIO-CI Neural Interface Lab ready.';
            if (step) step.innerText = 'Step 3/3: Complete';
            setTimeout(function() {
              if (shell) {
                shell.style.transition = 'opacity 0.25s ease-out, transform 0.25s ease-out';
                shell.style.opacity = '0';
                shell.style.transform = 'scale(0.98)';
                setTimeout(function() {
                  if (shell && shell.parentNode) {
                    shell.parentNode.removeChild(shell);
                  }
                }, 260);
              }
            }, 80);
          };

          // Function to display diagnostics if an error occurs
          window.bioShowError = function(errMsg, details) {
            clearInterval(timer);
            if (bar) {
              bar.style.width = '100%';
              bar.style.background = '#ef4444';
            }
            if (pct) pct.innerText = 'Notice';
            if (status) {
              status.style.color = '#f87171';
              status.innerText = errMsg || 'Startup initialization diagnostic';
            }
            if (fallback) {
              fallback.style.display = 'block';
              fallback.innerHTML = `
                <div style="background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3); border-radius: 10px; padding: 12px; margin-bottom: 12px; text-align: left;">
                  <div style="color: #fca5a5; font-size: 11px; font-weight: 600; margin-bottom: 4px;">GitHub Pages Diagnostic:</div>
                  <div style="color: #cbd5e1; font-size: 10.5px; font-family: monospace; word-break: break-all; margin-bottom: 6px;">${details || errMsg}</div>
                  <div style="color: #94a3b8; font-size: 10.5px; line-height: 1.4;">
                    <strong>Recommended Fix:</strong> In your GitHub repository <strong>Settings &gt; Pages</strong>, set <strong>Source</strong> to <strong>GitHub Actions</strong> (or branch <strong>gh-pages</strong>).
                  </div>
                </div>
                <div style="display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;">
                  <a href="https://github.com/aysha2016/BIO-CI-Neural-Interface-Lab/settings/pages" target="_blank" rel="noopener noreferrer" style="display: inline-block; background: #0891b2; color: white; text-decoration: none; padding: 7px 14px; border-radius: 8px; font-size: 12px; font-weight: 600;">
                    Open Pages Settings
                  </a>
                  <button onclick="window.bioAppMounted && window.bioAppMounted()" style="background: #1e293b; color: #e2e8f0; border: 1px solid #334155; padding: 7px 14px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer;">
                    Bypass Loader
                  </button>
                </div>
              `;
            }
          };

          // Active progress timer: progresses smoothly through stages
          var timer = setInterval(function() {
            if (isMounted) return;
            if (progress < 90) {
              progress += Math.floor(Math.random() * 12) + 6;
              if (progress > 90) progress = 90;
            } else if (progress < 98) {
              // Gentle increments beyond 90% so it never appears frozen
              progress += 1;
            }
            if (bar) bar.style.width = progress + '%';
            if (pct) pct.innerText = progress + '%';
            
            if (progress >= 35 && progress < 65 && status) {
              status.innerText = 'Compiling biophysical Hodgkin-Huxley & multi-compartment solvers...';
              if (step) step.innerText = 'Step 2/3: Biophysics ready';
            } else if (progress >= 65 && progress < 92 && status) {
              status.innerText = 'Mounting 3D cochlea canvas & interactive neural dashboard...';
              if (step) step.innerText = 'Step 3/3: Mounting UI';
            } else if (progress >= 92 && status) {
              status.innerText = 'Synchronizing electrode arrays & neural telemetry...';
              if (step) step.innerText = 'Step 3/3: Finalizing';
            }
          }, 200);

          // Listen for unhandled errors with capture to catch script loading issues
          window.addEventListener('error', function(e) {
            if (!isMounted && e && e.target && e.target.tagName === 'SCRIPT') {
              // Script element loading failure
              var src = e.target.getAttribute('src') || '';
              if (src.indexOf('main.tsx') !== -1) {
                // Ignore raw main.tsx 404 since dynamic bridge handles production asset loading
                return;
              }
            }
          }, true);

          window.addEventListener('unhandledrejection', function(e) {
            if (!isMounted) {
              console.warn('Unhandled rejection during startup:', e.reason);
            }
          });

          // Show diagnostic fallback button if bundle download takes more than 5s
          setTimeout(function() {
            if (!isMounted && fallback && document.getElementById('bio-loader-shell')) {
              fallback.style.display = 'block';
            }
          }, 5000);
        })();
      </script>
    </div>
    <!-- Development entry point (auto-removes on production static host) -->
    <script type="module" src="/src/main.tsx" onerror="this.remove()"></script>
  </body>
</html>
